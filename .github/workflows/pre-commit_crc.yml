---
# This workflow action will run pre-commit, which will execute ansible and yaml linting
# See .pre-commit-config.yaml for what hooks are executed
#
# Fork pull_request runs do not receive Automation Hub secrets. Push/schedule runs
# (with secrets) populate the Ansible collections cache; fork PRs restore that cache
# and install offline.
name: pre-commit tests


on:
  workflow_call:
    inputs:
      collection_namespace:
        description: "Install collection python dependencies"
        required: true
        type: string
      collection_name:
        description: "Path to the collection source"
        required: true
        type: string
      collection_version:
        description: The final collection path
        required: false
        type: string
      collection_repo:
        description: The collection url
        required: false
        type: string
    secrets:
      ansible_ah_token:
        description: API key for galaxy
        required: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Prefer PR head (incl. forks); fall back for push/schedule cache warming.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Ansible
        run: pip install --upgrade "ansible-core>=2.20" pyyaml==6.0.1
      - name: Cache Ansible collections
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('galaxy.yml', '**/requirements*.yml', '**/requirements*.yaml') }}
          restore-keys: |
            ansible-collections-${{ runner.os }}-
      - name: Install collection
        run: |
          set -euo pipefail
          if [ -n "${ANSIBLE_GALAXY_SERVER_PUBLISHED_TOKEN:-}" ]; then
            ansible-galaxy collection install . -vvvv
          else
            echo "No Automation Hub token available (typical for fork pull_request)."
            echo "Installing from the restored Ansible collections cache (--offline)."
            if ! ansible-galaxy collection install . --offline -vvvv; then
              echo "::error::Offline collection install failed. Push/schedule runs must populate the Ansible collections cache (with CRC_PUBLISH_KEY) before fork PRs can use it."
              exit 1
            fi
          fi
        shell: bash
        env:
          ANSIBLE_GALAXY_SERVER_VALIDATED_URL: 'https://console.redhat.com/api/automation-hub/content/validated/'
          ANSIBLE_GALAXY_SERVER_VALIDATED_TOKEN: ${{ secrets.ansible_ah_token}}
          ANSIBLE_GALAXY_SERVER_VALIDATED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
          ANSIBLE_GALAXY_SERVER_PUBLISHED_URL: 'https://console.redhat.com/api/automation-hub/content/published/'
          ANSIBLE_GALAXY_SERVER_PUBLISHED_TOKEN: ${{ secrets.ansible_ah_token }}
          ANSIBLE_GALAXY_SERVER_PUBLISHED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
          ANSIBLE_GALAXY_SERVER_COMMUNITY_URL: 'https://galaxy.ansible.com/'
          ANSIBLE_GALAXY_SERVER_LIST: 'published, validated, community'
      - uses: pre-commit/action@v3.0.1
...
